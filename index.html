<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>Deutsch Lernen</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- Home screen -->
<div class="screen" id="screen-home">
  <div class="top-bar">
    <h1>&#127465;&#127466; Deutsch</h1>
    <button class="icon-btn" id="search-toggle-btn">&#128269;</button>
  </div>
  <div style="padding:16px">
    <div id="search-bar-container" class="hidden">
      <div class="search-bar">
        <span>&#128269;</span>
        <input type="search" id="search-input" placeholder="Search German or English..." autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
    <div id="home-main">
      <div class="stat-tiles">
        <div class="stat-tile streak">
          <div class="value" id="stat-streak">0</div>
          <div class="label">day streak</div>
        </div>
        <div class="stat-tile mastered">
          <div class="value" id="stat-mastered">0</div>
          <div class="label">mastered</div>
        </div>
        <div class="stat-tile due">
          <div class="value" id="stat-due">0</div>
          <div class="label">due today</div>
        </div>
      </div>
      <button class="btn-primary" id="start-review-btn">Start today&#x2019;s review &#x2192;</button>
      <div class="section-label">Browse</div>
      <div class="batch-pills" id="batch-pills"></div>
    </div>
  </div>
</div>

<!-- Browse screen -->
<div class="screen" id="screen-browse">
  <div class="top-bar">
    <h1 id="browse-title">Browse</h1>
    <button class="icon-btn" id="quiz-batch-btn">&#127183;</button>
  </div>
  <div style="padding:0 16px">
    <div class="day-tabs" id="day-tabs"></div>
  </div>
  <div style="padding:0 16px 16px" id="word-list"></div>
</div>

<!-- Flashcard screen -->
<div class="screen" id="screen-flashcard">
  <div class="top-bar">
    <h1>Review</h1>
    <button class="icon-btn" id="flashcard-close-btn">&#10005;</button>
  </div>
  <div id="flashcard-body"></div>
</div>

<!-- Stats screen -->
<div class="screen" id="screen-stats">
  <div class="top-bar"><h1>Stats</h1></div>
  <div style="padding:16px" id="stats-body"></div>
</div>

<!-- Bookmarks screen -->
<div class="screen" id="screen-bookmarks">
  <div class="top-bar">
    <h1>Saved</h1>
    <button class="icon-btn" id="review-bookmarks-btn">&#127183;</button>
  </div>
  <div style="padding:16px" id="bookmarks-body"></div>
</div>

<!-- Settings screen -->
<div class="screen" id="screen-settings">
  <div class="top-bar"><h1>Settings</h1></div>
  <div style="padding:16px" id="settings-body"></div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn" data-screen="home"><span class="icon">&#127968;</span>Home</button>
  <button class="nav-btn" data-screen="bookmarks"><span class="icon">&#9733;</span>Saved</button>
  <button class="nav-btn" data-screen="stats"><span class="icon">&#128202;</span>Stats</button>
  <button class="nav-btn" data-screen="settings"><span class="icon">&#9881;&#65039;</span>Settings</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
